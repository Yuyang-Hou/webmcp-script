name: 问题反馈
description: 报告可复现的问题，不要上传配对码或浏览器资料。
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 产品版本、操作系统、浏览器版本、MCP 客户端与已脱敏的错误信息。
    validations:
      required: true
